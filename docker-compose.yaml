version: "2.0"
services:
  webapp:
    image: juniper/nita-webapp:22.8-1
    command: ./build-and-test-webapp/wait-for-db.sh
    networks:
      - nita-network
    depends_on: [ db ]
    environment:
      - DJANGO_LOG_LEVEL=DEBUG
      - DJANGO_SECRET_KEY
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS
      - CSRF_TRUSTED_ORIGINS
      - WEBAPP_USER
      - WEBAPP_PASS
      - JENKINS_USER
      - JENKINS_PASS
      - JENKINS_PORT
      - JENKINS_URL
#
# Onboarding: self-service registration is ENABLED by default (both public
# sign-up and admin-created accounts are active). Set this to False to disable
# public POST /api/v1/auth/register/ and rely on admin-created accounts only.
# Only the exact value "True" enables it; anything else disables it.
#      - NITA_SELF_REGISTRATION_ENABLED=True
#
# Bootstrap the initial admin account (role=admin) on a fresh deployment.
# These only take effect when the database has zero users. Uncomment and set
# strong values before first start, then remove/rotate after the admin exists.
#      - NITA_BOOTSTRAP_ADMIN_USERNAME=admin
#      - NITA_BOOTSTRAP_ADMIN_EMAIL=admin@example.com
#      - NITA_BOOTSTRAP_ADMIN_PASSWORD=change-me
    restart: always
#
# For external Jenkins hosts, uncomment the lines below and change IP
# Jenkins' server IP address. This allows the name Jenkins to resolve
# properly in the container environment. Please see detailed instructions
# in README file for implications of this change.
#
#    extra_hosts:
#      - "jenkins:192.168.X.y"
  db:
    # MariaDB 10.5+ is required by Django 5.2 (10.4 fails migrate with NotSupportedError).
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: Sites
      MYSQL_ROOT_PASSWORD: root
    networks:
      - nita-network
    volumes:
      - "mariadb:/var/lib/mysql"
    restart: always
  proxy:
    image: nginx:stable
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "./nginx/certificates/:/etc/certificate/"
    ports:
      - "443:443"
    networks:
      - nita-network
    depends_on: [ webapp ]
    restart: always
volumes:
  mariadb:
networks:
  nita-network:
    external: true
