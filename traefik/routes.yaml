http:
  routers:
    webapp-http:
      rule: PathPrefix(`/`)
      entryPoints: [web]
      service: webapp
      middlewares: [bodylimit]
      priority: 1
    webapp-https:
      rule: PathPrefix(`/`)
      entryPoints: [websecure]
      service: webapp
      middlewares: [bodylimit]
      priority: 1
      tls: {}
    jenkins-http:
      rule: Path(`/jenkins`) || PathPrefix(`/jenkins/`)
      entryPoints: [web]
      service: jenkins
      middlewares: [bodylimit, jenkins-slash, jenkins-headers, jenkins-auth, jenkins-identity]
      priority: 10
    jenkins-https:
      rule: Path(`/jenkins`) || PathPrefix(`/jenkins/`)
      entryPoints: [websecure]
      service: jenkins
      middlewares: [bodylimit, jenkins-slash, jenkins-headers, jenkins-auth, jenkins-identity]
      priority: 10
      tls: {}

  middlewares:
    bodylimit:
      plugin:
        bodylimit:
          maxBytes: 20971520
    jenkins-slash:
      redirectRegex:
        regex: "^(https?://[^/]+)/jenkins(\\?.*)?$"
        replacement: "${1}/jenkins/${2}"
    jenkins-headers:
      headers:
        customRequestHeaders:
          Authorization: ""
          X-Forwarded-Prefix: /jenkins
    jenkins-auth:
      forwardAuth:
        address: http://webapp:8000/api/v1/auth/forward/
        trustForwardHeader: false
        preserveLocationHeader: true
        authRequestHeaders: [Cookie]
        authResponseHeaders: [X-Forwarded-User, X-Forwarded-Groups]
    jenkins-identity:
      plugin:
        identityguard: {}

  services:
    webapp:
      loadBalancer:
        servers:
          - url: http://webapp:8000
    jenkins:
      loadBalancer:
        servers:
          - url: http://jenkins:8080

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/certificate/nginx-certificate.crt
        keyFile: /etc/certificate/nginx-certificate-key.key
