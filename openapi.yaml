          type: array
          items:
            $ref: '#/components/schemas/Team'
          maxItems: 1000
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
          maxItems: 1000
    PatchedCampusNetwork:
      type: object
      description: |-
        Serializer for CampusNetwork.  Adds ``campus_type_name`` for convenience.

        ``owner`` is read-only (assigned automatically to the creating user);
        ``team`` is writable so an owner/admin can share the network with a team.
        ``owner_username`` and ``team_name`` are read-only display helpers.
      properties:
        id:
          type: integer
          readOnly: true
        campus_type_name:
          type: string
          readOnly: true
        owner_username:
          type: string
          readOnly: true
        team_name:
          type: string
          readOnly: true
        name:
          type: string
          title: Network Name
          maxLength: 255
        status:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
        host_file:
          type: string
        campus_type:
          type: integer
          title: Network Type
        owner:
          type: integer
          readOnly: true
          nullable: true
        team:
          type: integer
          nullable: true
    PatchedTeam:
      type: object
      description: Serializer for Team. ``members`` is a list of user ids.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Team Name
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 255
        created_by:
          type: integer
          readOnly: true
        members:
          type: array
          items:
            type: integer
          maxItems: 1000
    PatchedUser:
      type: object
      description: |-
        Serializer for the admin user-management API.

        ``role`` and ``is_active`` are writable (admin-only via the viewset);
        ``username`` and ``email`` are read-only here.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
    RoleEnum:
      enum:
      - user
      - power_user
      - admin
      type: string
      description: |-
        * `user` - User
        * `power_user` - Power user
        * `admin` - Admin
    Team:
      type: object
      description: Serializer for Team. ``members`` is a list of user ids.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Team Name
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 255
        created_by:
          type: integer
          readOnly: true
        members:
          type: array
          items:
            type: integer
          maxItems: 1000
      required:
      - created_by
      - id
      - name
    User:
      type: object
      description: |-
        Serializer for the admin user-management API.

        ``role`` and ``is_active`` are writable (admin-only via the viewset);
        ``username`` and ``email`` are read-only here.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
      required:
      - email
      - id
      - username
    UserRegistration:
      type: object
      description: |-
        Serializer for self-service registration.

        Forces ``role=user`` regardless of any supplied value and validates the
        password with Django's configured password validators.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - id
      - password
      - role
      - username
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
servers:
- url: https://localhost
  description: NITA Webapp (HTTPS)
security:
- tokenAuth: []
