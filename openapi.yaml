components:
  schemas:
    Action:
      type: object
      description: Serializer for Action.  Nests ActionProperty and ActionCategory
        inline.
      properties:
        id:
          type: integer
          readOnly: true
        action_property:
          allOf:
          - $ref: '#/components/schemas/ActionProperty'
          readOnly: true
        action_category:
          allOf:
          - $ref: '#/components/schemas/ActionCategory'
          readOnly: true
        action_name:
          type: string
          maxLength: 255
        jenkins_url:
          type: string
          title: Jenkins Action Url
          maxLength: 255
        campus_type_id:
          type: integer
      required:
      - action_category
      - action_name
      - action_property
      - campus_type_id
      - id
      - jenkins_url
    ActionCategory:
      type: object
      description: Serializer for ActionCategory (build / test / deploy labels).
      properties:
        id:
          type: integer
          readOnly: true
        category_name:
          type: string
          maxLength: 255
      required:
      - category_name
      - id
    ActionHistory:
      type: object
      description: |-
        Serializer for ActionHistory.

        Adds ``action_name``, ``category_name``, and ``network_name`` as read-only
        string fields so consumers can display context without extra look-ups.
        ``jenkins_job_name`` exposes the Jenkins job for the run
        (``{action.jenkins_url}-{network_name}``) so clients can build a link to the
        build result.
      properties:
        id:
          type: integer
          readOnly: true
        action_name:
          type: string
          readOnly: true
        category_name:
          type: string
          readOnly: true
        network_name:
          type: string
          readOnly: true
        jenkins_job_name:
          type: string
          description: Return the Jenkins job name for this run.
          readOnly: true
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          maxLength: 255
        jenkins_job_build_no:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          title: Jenkins Job Id
        action_id:
          type: integer
        category_id:
          type: integer
        campus_network_id:
          type: integer
      required:
      - action_id
      - action_name
      - campus_network_id
      - category_id
      - category_name
      - id
      - jenkins_job_build_no
      - jenkins_job_name
      - network_name
      - status
      - timestamp
    ActionProperty:
      type: object
      description: Serializer for ActionProperty (shell command + workspace configuration).
      properties:
        id:
          type: integer
          readOnly: true
        shell_command:
          type: string
          maxLength: 255
        output_path:
          type: string
          nullable: true
          maxLength: 255
        custom_workspace:
          type: string
          nullable: true
          title: Output Path
          maxLength: 255
      required:
      - id
      - shell_command
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    CampusNetwork:
      type: object
      description: |-
        Serializer for CampusNetwork.  Adds ``campus_type_name`` for convenience.

        ``owner`` is read-only (assigned automatically to the creating user);
        ``team`` is writable so an owner/admin can share the network with a team.
        ``owner_username`` and ``team_name`` are read-only display helpers.
      properties:
        id:
          type: integer
          readOnly: true
        campus_type_name:
          type: string
          readOnly: true
        owner_username:
          type: string
          readOnly: true
        team_name:
          type: string
          readOnly: true
        name:
          type: string
          title: Network Name
          maxLength: 255
        status:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
        host_file:
          type: string
        campus_type:
          type: integer
          title: Network Type
        owner:
          type: integer
          readOnly: true
          nullable: true
        team:
          type: integer
          nullable: true
      required:
      - campus_type
      - campus_type_name
      - description
      - host_file
      - id
      - name
      - owner
      - owner_username
      - status
      - team_name
    CampusType:
      type: object
      description: Serializer for CampusType.
      properties:
        id:
          type: integer
          readOnly: true
        created_by:
          type: integer
          readOnly: true
        name:
          type: string
          title: Network Type Name
          maxLength: 255
        description:
          type: string
          maxLength: 255
        app_zip_name:
          type: string
          maxLength: 255
      required:
      - app_zip_name
      - created_by
      - description
      - id
      - name
    KindEnum:
      enum:
      - network_create
      - network_delete
      - network_type_load
      type: string
      description: |-
        * `network_create` - Network create
        * `network_delete` - Network delete
        * `network_type_load` - Network type load
    LifecycleRun:
      type: object
      description: Serializer for a network lifecycle Jenkins job run (history entry).
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        subject:
          type: string
          maxLength: 255
        job_name:
          type: string
          maxLength: 255
        build_no:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        timestamp:
          type: string
          format: date-time
          readOnly: true
        status:
          type: string
          maxLength: 64
      required:
      - build_no
      - id
      - job_name
      - kind
      - status
      - subject
      - timestamp
    PaginatedActionCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
